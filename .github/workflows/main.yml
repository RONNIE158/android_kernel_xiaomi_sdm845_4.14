
name: Upstream 4.9 to 4.14 and Build

on:
  workflow_dispatch:

jobs:
  upstream_and_build:
    runs-on: ubuntu-latest

    env:
      DEFCONFIG: vendor/beryllium_defconfig
      KERNEL_4_9_REPO: https://github.com/RONNIE158/android_kernel_xiaomi_sdm845
      KERNEL_4_14_REPO: https://github.com/RONNIE158/android_kernel_xiaomi_sdm845_4.14
      KERNEL_DIR: ${{ github.workspace }}/android_kernel_xiaomi_sdm845_4.14
      OUT_DIR: out
      COMMIT_MSG: Upstream 4.9 changes to 4.14 and build kernel

    steps:
    - name: Checkout Kernel 4.14
      uses: actions/checkout@v3
      with:
        repository: RONNIE158/android_kernel_xiaomi_sdm845_4.14
        ref: rebase
        path: android_kernel_xiaomi_sdm845_4.14
        fetch-depth: 0

    - name: Clone Kernel 4.9 Source
      run: git clone --depth=1 $KERNEL_4_9_REPO kernel-4.9

    - name: Prepare Target Directories
      run: |
        mkdir -p $KERNEL_DIR/arch/arm64/configs
        mkdir -p $KERNEL_DIR/arch/arm64/boot/dts/qcom
        mkdir -p $KERNEL_DIR/drivers/soc/qcom

    - name: Import defconfig, DTSI, and QCOM SoC Drivers from 4.9
      run: |
        cp kernel-4.9/arch/arm64/configs/$DEFCONFIG $KERNEL_DIR/arch/arm64/configs/
        cp -r kernel-4.9/arch/arm64/boot/dts/qcom/* $KERNEL_DIR/arch/arm64/boot/dts/qcom/
        cp -r kernel-4.9/drivers/soc/qcom/* $KERNEL_DIR/drivers/soc/qcom/

    - name: Clone Toolchains
      run: |
        mkdir -p toolchain
        git clone --depth=1 -b lineage-20.0 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b toolchain/clang
        git clone --depth=1 -b test https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/aarch64
        git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain/arm
        echo "$GITHUB_WORKSPACE/toolchain/clang/bin" >> $GITHUB_PATH
        echo "$GITHUB_WORKSPACE/toolchain/aarch64/bin" >> $GITHUB_PATH
        echo "$GITHUB_WORKSPACE/toolchain/arm/bin" >> $GITHUB_PATH

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential cpio flex libssl-dev libncurses5-dev libelf-dev python3

    - name: Build Kernel
      run: |
        export CLANG_PATH=$GITHUB_WORKSPACE/toolchain/clang/bin
        export GCC_AARCH64=$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-android-
        export GCC_ARM32=$GITHUB_WORKSPACE/toolchain/arm/bin/arm-linux-androideabi-
        export PATH=$CLANG_PATH:$PATH

        make -C $KERNEL_DIR O=$KERNEL_DIR/$OUT_DIR ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=$GCC_AARCH64 CROSS_COMPILE_ARM32=$GCC_ARM32 CLANG_TRIPLE=aarch64-linux-gnu- CC=clang $DEFCONFIG
        make -C $KERNEL_DIR O=$KERNEL_DIR/$OUT_DIR ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=$GCC_AARCH64 CROSS_COMPILE_ARM32=$GCC_ARM32 CLANG_TRIPLE=aarch64-linux-gnu- CC=clang -j$(nproc)

    - name: Generate Image.gz-dtb
      run: |
        cat $KERNEL_DIR/$OUT_DIR/arch/arm64/boot/Image.gz $KERNEL_DIR/$OUT_DIR/arch/arm64/boot/dts/qcom/dipper.dtb > $KERNEL_DIR/$OUT_DIR/Image.gz-dtb

    - name: Upload Kernel Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image-gz-dtb
        path: ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/Image.gz-dtb

    - name: Commit and Push Changes to 4.14
      run: |
        cd $KERNEL_DIR
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "${COMMIT_MSG}" || echo "No changes to commit"
        git push origin rebase
